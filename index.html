        '<div style="font-size:18px;font-weight:700;margin-bottom:8px;">Couldn\'t load the app</div>' +

        "</div>";
    }
  }, 8000);
</script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useRef } = React;

const Settings = (p) => <Icon {...p}><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z" /><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z" /></Icon>;

const Lock = (p) => <Icon {...p}><rect width="18" height="11" x="3" y="11" rx="2" ry="2" /><path d="M7 11V7a5 5 0 0 1 10 0v4" /></Icon>;
const TrendingUp = (p) => <Icon {...p}><path d="M23 6l-9.5 9.5-5-5L1 18" /><path d="M17 6h6v6" /></Icon>;
const Undo2 = (p) => <Icon {...p}><path d="M9 14 4 9l5-5" /><path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5v0a5.5 5.5 0 0 1-5.5 5.5H11" /></Icon>;
const ClipboardList = (p) => <Icon {...p}><rect width="8" height="4" x="8" y="2" rx="1" ry="1" /><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2" /><path d="M12 11h4" /><path d="M12 16h4" /><path d="M8 11h.01" /><path d="M8 16h.01" /></Icon>;
const Delete = (p) => <Icon {...p}><path d="M20 5H9l-7 7 7 7h11a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2Z" /><line x1="18" x2="12" y1="9" y2="15" /><line x1="12" x2="18" y1="9" y2="15" /></Icon>;
const Truck = (p) => <Icon {...p}><path d="M14 18V6a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1v11a1 1 0 0 0 1 1h1" /><path d="M15 18H9" /><path d="M19 18h2a1 1 0 0 0 1-1v-3.65a1 1 0 0 0-.22-.624l-3.48-4.35A1 1 0 0 0 17.52 8H14" /><circle cx="17" cy="18" r="2" /><circle cx="7" cy="18" r="2" /></Icon>;
const History = (p) => <Icon {...p}><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" /><path d="M3 3v5h5" /><path d="M12 7v5l4 2" /></Icon>;
const Wallet = (p) => <Icon {...p}><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4" /><path d="M3 5v14a2 2 0 0 0 2 2h16v-5" /><path d="M18 12a2 2 0 0 0 0 4h4v-4Z" /></Icon>;

// ---------- design tokens ----------
const BG = "#0a0a0a";
const CARD = "#151515";
const CARD2 = "#1c1c1c";
const BORDER = "#2b2b2b";
const GOLD = "#E3A93C";
const GOLD_DIM = "#3a2f16";
const TEXT = "#f3f1ea";
const MUTED = "#8c8a84";
const DANGER = "#d9694f";
const DANGER_DIM = "#3a2018";
const SERIF = "Georgia, 'Iowan Old Style', 'Palatino Linotype', serif";

const peso = (n) =>
  "\u20B1" + Number(n || 0).toLocaleString("en-PH", { minimumFractionDigits: 2, maximumFractionDigits: 2 });

const fmtQty = (n, unit) => (unit === "kg" ? Number(n).toFixed(2) + " kg" : Number(n) + " pc");

const fmtDate = (ts) =>
  new Date(ts).toLocaleString([], { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });

const fmtDateShort = (ts) => new Date(ts).toLocaleDateString([], { month: "short", day: "numeric" });

const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36);

const sameDay = (ts, ref = Date.now()) => new Date(ts).toDateString() === new Date(ref).toDateString();
const todayKey = () => new Date().toDateString();

const startOfDay = (ts) => {
  const d = new Date(ts);
  d.setHours(0, 0, 0, 0);
  return d.getTime();
};
const endOfDay = (ts) => {
  const d = new Date(ts);
  d.setHours(23, 59, 59, 999);
  return d.getTime();
};
const startOfWeek = (ts = Date.now()) => {
  const d = new Date(ts);
  const day = d.getDay(); // 0 = Sunday
  d.setDate(d.getDate() - day);
  d.setHours(0, 0, 0, 0);
  return d.getTime();
};
const startOfMonth = (ts = Date.now()) => {
  const d = new Date(ts);
  d.setDate(1);
  d.setHours(0, 0, 0, 0);
  return d.getTime();
};

const remainingOf = (sale) => Math.max(0, Number(sale.total) - Number(sale.paidAmount || 0));
const marginRateOf = (sale) => (sale.total > 0 ? (sale.total - (sale.totalCost || 0)) / sale.total : 0);

const DEFAULT_THRESHOLD = { piece: 5, kg: 1 };
const thresholdOf = (p) => (p.lowStockThreshold !== undefined && p.lowStockThreshold !== null && p.lowStockThreshold !== "" ? Number(p.lowStockThreshold) : DEFAULT_THRESHOLD[p.soldBy]);
const isOut = (p) => Number(p.stock) <= 0;
const isLow = (p) => !isOut(p) && Number(p.stock) <= thresholdOf(p);

const CATEGORY_SUGGESTIONS = ["Inumin", "Meryenda", "De lata", "Toiletries", "Iba pa"];
const UNCATEGORIZED = "Uncategorized";

const BACKUP_VERSION = 2;
const BACKUP_REMIND_AFTER = 3 * 24 * 60 * 60 * 1000; // 3 days

function inRange(ts, range, customStart, customEnd) {
  if (range === "today") return sameDay(ts);
  if (range === "week") return ts >= startOfWeek();
  if (range === "month") return ts >= startOfMonth();
  if (range === "all") return true;
  if (range === "custom") {
    const s = customStart ? startOfDay(new Date(customStart).getTime()) : -Infinity;
    const e = customEnd ? endOfDay(new Date(customEnd).getTime()) : Infinity;
    return ts >= s && ts <= e;
  }
  return true;
}

function groupByCategory(products) {
  const map = {};
  products.forEach((p) => {
    const cat = p.category && p.category.trim() ? p.category.trim() : UNCATEGORIZED;
    if (!map[cat]) map[cat] = [];
    map[cat].push(p);
  });
  return Object.keys(map)
    .sort((a, b) => (a === UNCATEGORIZED ? 1 : b === UNCATEGORIZED ? -1 : a.localeCompare(b)))
    .map((cat) => ({ cat, items: map[cat] }));
}

function CounterApp() {
  const [tab, setTab] = useState("sell");
  const [products, setProducts] = useState([]);
  const [sales, setSales] = useState([]);
  const [customers, setCustomers] = useState({});
  const [deliveries, setDeliveries] = useState([]);
  const [cashLogs, setCashLogs] = useState([]);
  const [cashSessions, setCashSessions] = useState({});
  const [settings, setSettings] = useState({ pinEnabled: false, pin: null, lastBackupAt: null, backupReminderDismissedUntil: null });
  const [ready, setReady] = useState(false);
  const [unlocked, setUnlocked] = useState(false);

  // ---------- persistence (private to this device, via localStorage) ----------
  useEffect(() => {
    try {
      const raw = localStorage.getItem("counter-data");
      if (raw) {
        const parsed = JSON.parse(raw);
        setProducts(parsed.products || []);
        setSales(parsed.sales || []);
        setCustomers(parsed.customers || {});
        setDeliveries(parsed.deliveries || []);
        setCashLogs(parsed.cashLogs || []);
        setCashSessions(parsed.cashSessions || {});
        setSettings((s) => ({ ...s, ...(parsed.settings || {}) }));
        if (!(parsed.settings && parsed.settings.pinEnabled && parsed.settings.pin)) setUnlocked(true);
      } else {
        setUnlocked(true);
      }
    } catch (e) {
      setUnlocked(true);
    }
    setReady(true);
  }, []);

  useEffect(() => {
    if (!ready) return;
    try {
      localStorage.setItem("counter-data", JSON.stringify({ products, sales, customers, deliveries, cashLogs, cashSessions, settings }));
    } catch (e) {
      // storage full or unavailable — data stays in memory for this session
    }
  }, [products, sales, customers, deliveries, cashLogs, cashSessions, settings, ready]);

  // ---------- modals ----------
  const [showAddProduct, setShowAddProduct] = useState(false);
  const [editProduct, setEditProduct] = useState(null);
  const [restockProduct, setRestockProduct] = useState(null);
  const [cart, setCart] = useState([]);
  const [showCheckout, setShowCheckout] = useState(false);
  const [expandedCustomer, setExpandedCustomer] = useState(null);
  const [editCustomer, setEditCustomer] = useState(null);
  const [showSettings, setShowSettings] = useState(false);
  const [settingsInitialMode, setSettingsInitialMode] = useState("export");
  const [showClosing, setShowClosing] = useState(false);
  const [showDelivery, setShowDelivery] = useState(false);
  const [showHistory, setShowHistory] = useState(false);
  const [showCashDrawer, setShowCashDrawer] = useState(false);

  // ---------- derived ----------
  const totalStockPieces = products.filter((p) => p.soldBy === "piece").reduce((s, p) => s + Number(p.stock || 0), 0);
  const totalStockKg = products.filter((p) => p.soldBy === "kg").reduce((s, p) => s + Number(p.stock || 0), 0);
  const lowStockProducts = products.filter((p) => isLow(p) || isOut(p));

  const applyPayment = (customerName, amount) => {
    let left = Number(amount);
    if (left <= 0) return;
    setSales((prev) => {
      const next = prev.map((s) => ({ ...s, payments: s.payments ? [...s.payments] : [] }));
      const debts = next.filter((s) => s.customer === customerName && remainingOf(s) > 0.001).sort((a, b) => a.timestamp - b.timestamp);
      for (const sale of debts) {
        if (left <= 0.001) break;
        const owed = remainingOf(sale);
        const alloc = Math.min(owed, left);
        sale.paidAmount = Number((Number(sale.paidAmount || 0) + alloc).toFixed(2));
        sale.payments.push({ id: uid(), amount: alloc, timestamp: Date.now() });
        left = Number((left - alloc).toFixed(2));
      }
      return next;
    });
  };

  const undoLastSale = () => {
    if (sales.length === 0) return;
    const lastBatch = sales[sales.length - 1].batchId;
    const toUndo = lastBatch ? sales.filter((s) => s.batchId === lastBatch) : [sales[sales.length - 1]];
    setSales((s) => s.filter((sale) => !toUndo.includes(sale)));
    setProducts((ps) =>
      ps.map((p) => {
        const match = toUndo.find((s) => s.productId === p.id);
        return match ? { ...p, stock: Number(p.stock) + Number(match.qty) } : p;
      })
    );
  };

  const addToCart = (product, delta) => {
    setCart((prev) => {
      const stock = Number(product.stock);
      const existing = prev.find((c) => c.productId === product.id);
      if (existing) {
        const newQty = Math.max(0, Math.min(stock, Number((existing.qty + delta).toFixed(2))));
        if (newQty <= 0) return prev.filter((c) => c.productId !== product.id);
        return prev.map((c) => (c.productId === product.id ? { ...c, qty: newQty } : c));
      }
      if (delta <= 0) return prev;
      const step = product.soldBy === "kg" ? 0.1 : 1;
      return [...prev, { productId: product.id, name: product.name, soldBy: product.soldBy, price: product.price, cost: product.cost || 0, qty: Math.min(stock, step) }];
    });
  };

  const setCartQty = (productId, qty, stock) => {
    setCart((prev) => {
      const clamped = Math.max(0, Math.min(stock, qty));
      if (clamped <= 0) return prev.filter((c) => c.productId !== productId);
      return prev.map((c) => (c.productId === productId ? { ...c, qty: clamped } : c));
    });
  };

  const removeFromCart = (productId) => setCart((prev) => prev.filter((c) => c.productId !== productId));

  const setCashOpening = (amount) => {
    setCashSessions((s) => ({ ...s, [todayKey()]: { ...s[todayKey()], opening: Number(amount) } }));
  };
  const setCashClosing = (amount) => {
    setCashSessions((s) => ({ ...s, [todayKey()]: { ...s[todayKey()], closing: Number(amount) } }));
  };
  const addCashLog = (amount, reason) => {
    setCashLogs((ls) => [...ls, { id: uid(), amount: Number(amount), reason: reason.trim(), timestamp: Date.now() }]);
  };
  const removeCashLog = (id) => setCashLogs((ls) => ls.filter((l) => l.id !== id));

  const applyDelivery = (edits) => {
    const items = [];
    const nextProducts = products.map((p) => {
      const e = edits[p.id];
      const touched = e && ((e.price ?? "") !== "" || (e.cost ?? "") !== "" || (e.addQty ?? "") !== "");
      if (!touched) return p;
      const next = { ...p };
      if (e.price !== undefined && e.price !== "") next.price = Number(e.price);
      if (e.cost !== undefined && e.cost !== "") next.cost = Number(e.cost);
      if (e.addQty !== undefined && e.addQty !== "") next.stock = Number(p.stock) + Number(e.addQty);
      items.push({
        productId: p.id,
        name: p.name,
        soldBy: p.soldBy,
        oldPrice: p.price,
        newPrice: next.price,
        oldCost: p.cost || 0,
        newCost: next.cost || 0,
        addedQty: e.addQty !== undefined && e.addQty !== "" ? Number(e.addQty) : 0,
      });
      return next;
    });
    setProducts(nextProducts);
    if (items.length > 0) {
      setDeliveries((ds) => [...ds, { id: uid(), timestamp: Date.now(), items }]);
    }
  };

  const cartTotal = cart.reduce((s, c) => s + c.qty * c.price, 0);
  const cartCount = cart.reduce((s, c) => s + c.qty, 0);

  const checkoutCart = ({ customer, isPaid }) => {
    const batchId = uid();
    const now = Date.now();
    const newSales = cart.map((c) => {
      const total = Number((c.qty * c.price).toFixed(2));
      const totalCost = Number((c.qty * c.cost).toFixed(2));
      return {
        id: uid(),
        batchId,
        productId: c.productId,
        name: c.name,
        soldBy: c.soldBy,
        qty: c.qty,
        unitPrice: c.price,
        total,
        totalCost,
        customer: isPaid ? null : customer,
        paidAmount: isPaid ? total : 0,
        payments: isPaid ? [{ id: uid(), amount: total, timestamp: now }] : [],
        timestamp: now,
      };
    });
    setSales((s) => [...s, ...newSales]);
    setProducts((ps) =>
      ps.map((p) => {
        const inCart = cart.find((c) => c.productId === p.id);
        return inCart ? { ...p, stock: Math.max(0, Number(p.stock) - inCart.qty) } : p;
      })
    );
    setCart([]);
    setShowCheckout(false);
  };

  const importData = (parsed) => {
    setProducts(parsed.products || []);
    setSales(parsed.sales || []);
    setCustomers(parsed.customers || {});
    if (parsed.settings) setSettings((s) => ({ ...s, ...parsed.settings, pinEnabled: s.pinEnabled, pin: s.pin }));
  };

  const showBackupBanner =
    ready &&
    unlocked &&
    (products.length > 0 || sales.length > 0) &&
    (!settings.lastBackupAt || Date.now() - settings.lastBackupAt > BACKUP_REMIND_AFTER) &&
    (!settings.backupReminderDismissedUntil || Date.now() > settings.backupReminderDismissedUntil);

  if (!ready) return <div style={{ height: "100vh", background: BG }} />;

  if (!unlocked) {
    return (
      <LockScreen
        pin={settings.pin}
        onUnlock={() => setUnlocked(true)}
      />
    );
  }

  return (
    <div
      className="counter-app-mounted"
      style={{
        fontFamily: SERIF,
        background: BG,
        color: TEXT,
        height: "100vh",
        maxWidth: 480,
        margin: "0 auto",
        display: "flex",
        flexDirection: "column",
        position: "relative",
        overflow: "hidden",
        lineHeight: 1.5,
        letterSpacing: 0.1,
      }}
    >
      <Header onSettings={() => { setSettingsInitialMode("export"); setShowSettings(true); }} lowStockCount={lowStockProducts.length} />

      <div style={{ flex: 1, overflowY: "auto", paddingBottom: 88 }}>
        {showBackupBanner && (
          <BackupBanner
            onBackup={() => { setSettingsInitialMode("export"); setShowSettings(true); }}
            onDismiss={() => setSettings((s) => ({ ...s, backupReminderDismissedUntil: Date.now() + 24 * 60 * 60 * 1000 }))}
          />
        )}

        {tab === "sell" && <SellTab products={products} cart={cart} onAddToCart={addToCart} />}
        {tab === "stock" && (
          <StockTab
            products={products}
            onAdd={() => setShowAddProduct(true)}
            onEdit={(p) => setEditProduct(p)}
            onRestock={(p) => setRestockProduct(p)}
            onDelivery={() => setShowDelivery(true)}
            onHistory={() => setShowHistory(true)}
          />
        )}
        {tab === "utang" && (
          <UtangTab
            sales={sales}
            customers={customers}
            expandedCustomer={expandedCustomer}
            setExpandedCustomer={setExpandedCustomer}
            applyPayment={applyPayment}
            onEditInfo={(name) => setEditCustomer(name)}
          />
        )}
        {tab === "reports" && (
          <ReportsTab
            sales={sales}
            totalStockPieces={totalStockPieces}
            totalStockKg={totalStockKg}
            onUndoLast={undoLastSale}
            onOpenClosing={() => setShowClosing(true)}
            onOpenCashDrawer={() => setShowCashDrawer(true)}
          />
        )}
      </div>

      {cart.length > 0 && <CartBar count={cartCount} total={cartTotal} onCheckout={() => setShowCheckout(true)} />}

      <BottomNav tab={tab} setTab={setTab} utangAlert={Object.keys(customers).length > 0} />

      {showAddProduct && (
        <ProductForm
          onClose={() => setShowAddProduct(false)}
          onSave={(prod) => {
            setProducts((p) => [...p, { ...prod, id: uid() }]);
            setShowAddProduct(false);
          }}
        />
      )}

      {editProduct && (
        <ProductForm
          initial={editProduct}
          onClose={() => setEditProduct(null)}
          onSave={(prod) => {
            setProducts((ps) => ps.map((p) => (p.id === prod.id ? prod : p)));
            setEditProduct(null);
          }}
          onDelete={() => {
            setProducts((ps) => ps.filter((p) => p.id !== editProduct.id));
            setEditProduct(null);
          }}
        />
      )}

      {restockProduct && (
        <RestockSheet
          product={restockProduct}
          onClose={() => setRestockProduct(null)}
          onConfirm={(addQty) => {
            setProducts((ps) => ps.map((p) => (p.id === restockProduct.id ? { ...p, stock: Number(p.stock) + addQty } : p)));
            setRestockProduct(null);
          }}
        />
      )}

      {showDelivery && (
        <DeliverySheet
          products={products}
          onClose={() => setShowDelivery(false)}
          onApply={applyDelivery}
        />
      )}

      {showHistory && <DeliveryHistorySheet deliveries={deliveries} onClose={() => setShowHistory(false)} />}

      {showCashDrawer && (
        <CashDrawerSheet
          sales={sales}
          cashLogs={cashLogs}
          cashSessions={cashSessions}
          onClose={() => setShowCashDrawer(false)}
          onSetOpening={setCashOpening}
          onSetClosing={setCashClosing}
          onAddLog={addCashLog}
          onRemoveLog={removeCashLog}
        />
      )}

      {showCheckout && (
        <CheckoutSheet
          cart={cart}
          products={products}
          onClose={() => setShowCheckout(false)}
          onUpdateQty={setCartQty}
          onRemove={removeFromCart}
          onConfirm={checkoutCart}
        />
      )}

      {editCustomer && (
        <CustomerInfoSheet
          name={editCustomer}
          info={customers[editCustomer] || {}}
          onClose={() => setEditCustomer(null)}
          onSave={(info) => {
            setCustomers((c) => ({ ...c, [editCustomer]: info }));
            setEditCustomer(null);
          }}
        />
      )}

      {showSettings && (
        <SettingsSheet
          products={products}
          sales={sales}
          customers={customers}
          settings={settings}
          initialMode={settingsInitialMode}
          onClose={() => setShowSettings(false)}
          onImport={importData}
          onMarkBackedUp={() => setSettings((s) => ({ ...s, lastBackupAt: Date.now() }))}
          onSetPin={(pin) => setSettings((s) => ({ ...s, pin, pinEnabled: true }))}
          onRemovePin={() => setSettings((s) => ({ ...s, pin: null, pinEnabled: false }))}
        />
      )}

      {showClosing && (
        <ClosingSummarySheet sales={sales} products={lowStockProducts} onClose={() => setShowClosing(false)} />
      )}
    </div>
  );
}

// ---------- lock screen ----------
function LockScreen({ pin, onUnlock }) {
  const [buf, setBuf] = useState("");
  const [error, setError] = useState(false);
  const target = pin || "";

  useEffect(() => {
    if (target && buf.length === target.length) {
      if (buf === target) {
        onUnlock();
      } else {
        setError(true);
        setTimeout(() => {
          setBuf("");
          setError(false);
        }, 450);
      }
    }
  }, [buf]);

  const press = (d) => {
    if (buf.length < Math.max(target.length, 6)) setBuf((b) => b + d);
  };
  const backspace = () => setBuf((b) => b.slice(0, -1));

  return (
    <div
      className="counter-app-mounted"
      style={{
        fontFamily: SERIF,
        background: BG,
        color: TEXT,
        height: "100vh",
        maxWidth: 480,
        margin: "0 auto",
        display: "flex",
        flexDirection: "column",
        alignItems: "center",
        justifyContent: "center",
        gap: 24,
        lineHeight: 1.5,
      }}
    >
      <div style={{ width: 48, height: 48, borderRadius: 12, background: GOLD, color: "#141414", display: "flex", alignItems: "center", justifyContent: "center" }}>
        <Lock size={22} />
      </div>
      <div style={{ fontSize: 20 }}>Enter PIN</div>
      <div style={{ display: "flex", gap: 14 }}>
        {Array.from({ length: target.length }).map((_, i) => (
          <div
            key={i}
            style={{
              width: 14,
              height: 14,
              borderRadius: "50%",
              background: i < buf.length ? (error ? DANGER : GOLD) : "transparent",
              border: `1px solid ${error ? DANGER : BORDER}`,
            }}
          />
        ))}
      </div>
      {error && <div style={{ color: DANGER, fontSize: 13 }}>Mali ang PIN</div>}
      <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 64px)", gap: 16, marginTop: 8 }}>
        {["1", "2", "3", "4", "5", "6", "7", "8", "9"].map((d) => (
          <button key={d} onClick={() => press(d)} style={keypadBtnStyle}>
            {d}
          </button>
        ))}
        <div />
        <button onClick={() => press("0")} style={keypadBtnStyle}>
          0
        </button>
        <button onClick={backspace} style={{ ...keypadBtnStyle, background: "transparent", border: "none" }}>
          <Delete size={20} color={MUTED} />
        </button>
      </div>
    </div>
  );
}

// ---------- RESTOCK SHEET ----------
function RestockSheet({ product, onClose, onConfirm }) {
  const step = product.soldBy === "kg" ? 0.5 : 1;
  const [qty, setQty] = useState(step);
  return (
    <Sheet onClose={onClose} title={`Restock: ${product.name}`}>
      <div style={{ color: MUTED, fontSize: 14, marginBottom: 18 }}>Currently {fmtQty(product.stock, product.soldBy)} in stock.</div>
      <Field label={`Add quantity${product.soldBy === "kg" ? " (kg)" : ""}`}>
        <div style={{ display: "flex", alignItems: "center", gap: 14 }}>
          <RoundBtn onClick={() => setQty((q) => Math.max(step, Number((q - step).toFixed(2))))}>
            <Minus size={16} />
          </RoundBtn>
          <input style={{ ...inputStyle, textAlign: "center", flex: 1 }} type="number" inputMode="decimal" value={qty} onChange={(e) => setQty(Number(e.target.value))} />
          <RoundBtn onClick={() => setQty((q) => Number((q + step).toFixed(2)))}>
            <Plus size={16} />
          </RoundBtn>
        </div>
      </Field>
      <div style={{ display: "flex", justifyContent: "space-between", padding: "12px 0", borderTop: `1px solid ${BORDER}`, marginBottom: 18 }}>
        <span style={{ color: MUTED, fontSize: 14 }}>New stock total</span>
        <span style={{ color: GOLD, fontSize: 18 }}>{fmtQty(Number(product.stock) + Number(qty || 0), product.soldBy)}</span>
      </div>
      <button
        disabled={!qty || qty <= 0}
        onClick={() => onConfirm(Number(qty))}
        style={{ width: "100%", background: qty > 0 ? GOLD : CARD2, color: qty > 0 ? "#141414" : MUTED, border: "none", borderRadius: 10, padding: "16px", fontSize: 16, fontFamily: SERIF, fontWeight: 600, cursor: qty > 0 ? "pointer" : "default" }}
      >
        Add to stock
      </button>
    </Sheet>
  );
}

// ---------- DELIVERY SHEET (bulk price + stock update) ----------
function DeliverySheet({ products, onClose, onApply }) {
  const [q, setQ] = useState("");
  const [edits, setEdits] = useState({}); // { [productId]: { price, cost, addQty } }

  const filtered = products.filter((p) => p.name.toLowerCase().includes(q.toLowerCase()));

  const setField = (id, field, value) => {
    setEdits((prev) => ({ ...prev, [id]: { ...prev[id], [field]: value } }));
  };

  const isTouched = (e) => e && ((e.price ?? "") !== "" || (e.cost ?? "") !== "" || (e.addQty ?? "") !== "");
  const changedCount = Object.values(edits).filter(isTouched).length;

  return (
    <Sheet onClose={onClose} title="Delivery / restock">
      <div style={{ color: MUTED, fontSize: 13, marginBottom: 16, lineHeight: 1.5 }}>
        Update price, cost, and add stock for as many products as you need at once. Leave a field blank to leave it unchanged.
      </div>

      <div style={{ position: "relative", marginBottom: 14 }}>
        <Search size={16} color={MUTED} style={{ position: "absolute", left: 14, top: 15 }} />
        <input style={{ ...inputStyle, paddingLeft: 38 }} placeholder="Search products..." value={q} onChange={(e) => setQ(e.target.value)} />
      </div>

      <div style={{ display: "flex", flexDirection: "column", gap: 10, marginBottom: 18 }}>
        {filtered.map((p) => {
          const e = edits[p.id] || {};
          const touched = isTouched(e);
          return (
            <div key={p.id} style={{ background: CARD, border: `1px solid ${touched ? GOLD : BORDER}`, borderRadius: 12, padding: "12px 14px" }}>
              <div style={{ fontSize: 15 }}>{p.name}</div>
              <div style={{ fontSize: 13, color: MUTED, marginTop: 2, marginBottom: 10 }}>
                Ngayon: {peso(p.price)} {p.soldBy === "kg" ? "/ kg" : "/ pc"}
                {p.cost ? ` \u00b7 cost ${peso(p.cost)}` : ""} &middot; {fmtQty(p.stock, p.soldBy)}
              </div>
              <div style={{ display: "flex", gap: 8 }}>
                <input
                  style={{ ...inputStyle, padding: "10px 10px", fontSize: 13 }}
                  type="number"
                  inputMode="decimal"
                  placeholder="Bagong presyo"
                  value={e.price ?? ""}
                  onChange={(ev) => setField(p.id, "price", ev.target.value)}
                />
                <input
                  style={{ ...inputStyle, padding: "10px 10px", fontSize: 13 }}
                  type="number"
                  inputMode="decimal"
                  placeholder="Bagong cost"
                  value={e.cost ?? ""}
                  onChange={(ev) => setField(p.id, "cost", ev.target.value)}
                />
                <input
                  style={{ ...inputStyle, padding: "10px 10px", fontSize: 13 }}
                  type="number"
                  inputMode="decimal"
                  placeholder={`+ stock`}
                  value={e.addQty ?? ""}
                  onChange={(ev) => setField(p.id, "addQty", ev.target.value)}
                />
              </div>
            </div>
          );
        })}
        {filtered.length === 0 && <div style={{ color: MUTED, fontSize: 14, textAlign: "center", padding: "30px 0" }}>No matches.</div>}
      </div>

      <button
        disabled={changedCount === 0}
        onClick={() => {
          onApply(edits);
          onClose();
        }}
        style={{
          width: "100%",
          background: changedCount > 0 ? GOLD : CARD2,
          color: changedCount > 0 ? "#141414" : MUTED,
          border: "none",
          borderRadius: 10,
          padding: "16px",
          fontSize: 16,
          fontFamily: SERIF,
          fontWeight: 600,
          cursor: changedCount > 0 ? "pointer" : "default",
        }}
      >
        {changedCount > 0 ? `Apply to ${changedCount} product${changedCount > 1 ? "s" : ""}` : "Apply changes"}
      </button>
    </Sheet>
  );
}

// ---------- DELIVERY HISTORY ----------
function DeliveryHistorySheet({ deliveries, onClose }) {
  const [expanded, setExpanded] = useState(null);
  const sorted = deliveries.slice().reverse();

  return (
    <Sheet onClose={onClose} title="Delivery history">
      {sorted.length === 0 ? (
        <EmptyState icon={Truck} title="No deliveries yet" subtitle="Deliveries you apply from Stock will show up here." />
      ) : (
        <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
          {sorted.map((d) => {
            const isOpen = expanded === d.id;
            return (
              <div key={d.id} style={{ background: CARD, border: `1px solid ${BORDER}`, borderRadius: 12, overflow: "hidden" }}>
                <button
                  onClick={() => setExpanded(isOpen ? null : d.id)}
                  style={{ width: "100%", textAlign: "left", background: "transparent", border: "none", padding: "14px 16px", display: "flex", justifyContent: "space-between", alignItems: "center", cursor: "pointer", color: TEXT, fontFamily: SERIF }}
                >
                  <div>
                    <div style={{ fontSize: 15 }}>{fmtDate(d.timestamp)}</div>
                    <div style={{ fontSize: 13, color: MUTED, marginTop: 3 }}>
                      {d.items.length} product{d.items.length > 1 ? "s" : ""} updated
                    </div>
                  </div>
                  {isOpen ? <ChevronDown size={16} color={MUTED} /> : <ChevronRight size={16} color={MUTED} />}
                </button>

                {isOpen && (
                  <div style={{ borderTop: `1px solid ${BORDER}`, padding: "10px 16px 14px" }}>
                    {d.items.map((it, i) => (
                      <div key={it.productId + i} style={{ padding: "10px 0", borderBottom: i < d.items.length - 1 ? `1px solid ${BORDER}` : "none" }}>
                        <div style={{ fontSize: 14 }}>{it.name}</div>
                        <div style={{ fontSize: 13, color: MUTED, marginTop: 3, display: "flex", flexWrap: "wrap", gap: 10 }}>
                          {it.oldPrice !== it.newPrice && (
                            <span>
                              Presyo: {peso(it.oldPrice)} &rarr; <span style={{ color: GOLD }}>{peso(it.newPrice)}</span>
                            </span>
                          )}
                          {it.oldCost !== it.newCost && (
                            <span>
                              Cost: {peso(it.oldCost)} &rarr; <span style={{ color: GOLD }}>{peso(it.newCost)}</span>
                            </span>
                          )}
                          {it.addedQty > 0 && <span style={{ color: GOLD }}>+{fmtQty(it.addedQty, it.soldBy)}</span>}
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            );
          })}
        </div>
      )}
    </Sheet>
  );
}

// ---------- PRODUCT FORM (add / edit) ----------
function ProductForm({ initial, onClose, onSave, onDelete }) {
  const [name, setName] = useState(initial?.name || "");
  const [soldBy, setSoldBy] = useState(initial?.soldBy || "piece");
  const [price, setPrice] = useState(initial?.price ?? "");
  const [cost, setCost] = useState(initial?.cost ?? "");
  const [stock, setStock] = useState(initial?.stock ?? "");
  const [category, setCategory] = useState(initial?.category || "");
  const [threshold, setThreshold] = useState(initial?.lowStockThreshold ?? "");

  const valid = name.trim().length > 0 && Number(price) > 0;
  const catListId = "cat-suggestions";

  return (
    <Sheet onClose={onClose} title={initial ? "Edit product" : "Add product"}>
      <Field label="Product name">
        <input style={inputStyle} placeholder='e.g., "Coke 1.5L"' value={name} onChange={(e) => setName(e.target.value)} />
      </Field>

      <Field label="Sold by">
        <div style={{ display: "flex", gap: 12 }}>
          {[
            { id: "piece", label: "Piece", sub: "count items" },
            { id: "kg", label: "Kilogram", sub: "weigh items" },
          ].map((opt) => {
            const active = soldBy === opt.id;
            return (
              <button key={opt.id} onClick={() => setSoldBy(opt.id)} style={{ flex: 1, textAlign: "left", background: active ? GOLD_DIM : CARD, border: `1px solid ${active ? GOLD : BORDER}`, borderRadius: 10, padding: "14px 16px", cursor: "pointer", fontFamily: SERIF }}>
                <div style={{ color: active ? GOLD : TEXT, fontSize: 16 }}>{opt.label}</div>
                <div style={{ color: MUTED, fontSize: 13, marginTop: 2 }}>{opt.sub}</div>
              </button>
            );
          })}
        </div>
      </Field>

      <div style={{ display: "flex", gap: 12 }}>
        <div style={{ flex: 1 }}>
          <Field label="Price (\u20B1)">
            <input style={inputStyle} type="number" inputMode="decimal" placeholder="0.00" value={price} onChange={(e) => setPrice(e.target.value)} />
          </Field>
        </div>
        <div style={{ flex: 1 }}>
          <Field label="Cost (\u20B1, opt)">
            <input style={inputStyle} type="number" inputMode="decimal" placeholder="0.00" value={cost} onChange={(e) => setCost(e.target.value)} />
          </Field>
        </div>
      </div>

      <Field label={`Stock quantity${soldBy === "kg" ? " (kg)" : ""}`}>
        <input style={inputStyle} type="number" inputMode="decimal" step={soldBy === "kg" ? "0.01" : "1"} placeholder="0" value={stock} onChange={(e) => setStock(e.target.value)} />
      </Field>

      <div style={{ display: "flex", gap: 12 }}>
        <div style={{ flex: 1 }}>
          <Field label="Category (optional)">
            <input style={inputStyle} list={catListId} placeholder="e.g., Inumin" value={category} onChange={(e) => setCategory(e.target.value)} />
            <datalist id={catListId}>
              {CATEGORY_SUGGESTIONS.map((c) => (
                <option key={c} value={c} />
              ))}
            </datalist>
          </Field>
        </div>
        <div style={{ flex: 1 }}>
          <Field label={`Low stock at (opt, default ${DEFAULT_THRESHOLD[soldBy]})`}>
            <input style={inputStyle} type="number" inputMode="decimal" placeholder={String(DEFAULT_THRESHOLD[soldBy])} value={threshold} onChange={(e) => setThreshold(e.target.value)} />
          </Field>
        </div>
      </div>

      <button
        disabled={!valid}
        onClick={() =>
          onSave({
            id: initial?.id,
            name: name.trim(),
            soldBy,
            price: Number(price) || 0,
            cost: Number(cost) || 0,
            stock: Number(stock) || 0,
            category: category.trim(),
            lowStockThreshold: threshold === "" ? null : Number(threshold),
          })
        }
        style={{ width: "100%", background: valid ? GOLD : CARD2, color: valid ? "#141414" : MUTED, border: "none", borderRadius: 10, padding: "16px", fontSize: 16, fontFamily: SERIF, fontWeight: 600, cursor: valid ? "pointer" : "default", marginTop: 4 }}
      >
        {initial ? "Save changes" : "Add product"}
      </button>

      {initial && (
        <button onClick={onDelete} style={{ width: "100%", background: "transparent", color: DANGER, border: `1px solid ${DANGER}`, borderRadius: 10, padding: "14px", fontSize: 15, fontFamily: SERIF, cursor: "pointer", marginTop: 12, display: "flex", alignItems: "center", justifyContent: "center", gap: 8 }}>
          <Trash2 size={16} /> Delete product
        </button>
      )}
    </Sheet>
  );
}

// ---------- SELL TAB ----------
function SellTab({ products, cart, onAddToCart }) {
  const [q, setQ] = useState("");
  const filtered = products.filter((p) => p.name.toLowerCase().includes(q.toLowerCase()));
  const grouped = groupByCategory(filtered);

  return (
    <div>
      <div style={{ padding: "18px 20px 10px" }}>
        <div style={{ position: "relative" }}>
          <Search size={16} color={MUTED} style={{ position: "absolute", left: 14, top: 15 }} />
          <input style={{ ...inputStyle, paddingLeft: 38 }} placeholder="Search products..." value={q} onChange={(e) => setQ(e.target.value)} />
        </div>
      </div>

      {products.length === 0 ? (
        <EmptyState icon={Receipt} title="No products yet" subtitle="Add products in the Stock tab first." />
      ) : filtered.length === 0 ? (
        <EmptyState icon={Search} title="No matches" subtitle="Try a different search term." />
      ) : (
        <div style={{ padding: "0 20px 90px" }}>
          {grouped.map(({ cat, items }) => (
            <div key={cat}>
              {grouped.length > 1 && <CategoryHeader cat={cat} />}
              <div style={{ display: "flex", flexDirection: "column", gap: 10, marginTop: 4 }}>
                {items.map((p) => {
                  const out = isOut(p);
                  const inCart = cart.find((c) => c.productId === p.id);
                  const step = p.soldBy === "kg" ? 0.1 : 1;
                  return (
                    <div
                      key={p.id}
                      style={{ background: CARD, border: `1px solid ${out ? BORDER : isLow(p) ? GOLD : inCart ? GOLD : BORDER}`, borderRadius: 12, padding: "14px 16px", display: "flex", justifyContent: "space-between", alignItems: "center", opacity: out ? 0.5 : 1 }}
                    >
                      <div style={{ minWidth: 0 }}>
                        <div style={{ fontSize: 16 }}>{p.name}</div>
                        <div style={{ fontSize: 13, color: MUTED, marginTop: 4 }}>
                          {peso(p.price)} {p.soldBy === "kg" ? "/ kg" : "/ pc"} &middot; <StockBadge p={p} />
                        </div>
                      </div>
                      {out ? (
                        <div style={{ color: MUTED, fontSize: 13, flexShrink: 0, marginLeft: 8 }}>out</div>
                      ) : inCart ? (
                        <div style={{ display: "flex", alignItems: "center", gap: 10, flexShrink: 0, marginLeft: 8 }}>
                          <RoundBtn onClick={() => onAddToCart(p, -step)}>
                            <Minus size={14} />
                          </RoundBtn>
                          <span style={{ fontSize: 15, minWidth: 40, textAlign: "center" }}>{fmtQty(inCart.qty, p.soldBy)}</span>
                          <RoundBtn onClick={() => onAddToCart(p, step)}>
                            <Plus size={14} />
                          </RoundBtn>
                        </div>
                      ) : (
                        <button
                          onClick={() => onAddToCart(p, step)}
                          style={{ background: GOLD_DIM, border: `1px solid ${GOLD}`, color: GOLD, borderRadius: "50%", width: 34, height: 34, fontSize: 20, fontWeight: 300, cursor: "pointer", flexShrink: 0, marginLeft: 8, display: "flex", alignItems: "center", justifyContent: "center" }}
                        >
                          +
                        </button>
                      )}
                    </div>
                  );
                })}
              </div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

// ---------- SELL SHEET ----------
function CheckoutSheet({ cart, products, onClose, onUpdateQty, onRemove, onConfirm }) {
  const [mode, setMode] = useState("paid"); // paid | utang
  const [customer, setCustomer] = useState("");
  const [received, setReceived] = useState("");

  const total = cart.reduce((s, c) => s + c.qty * c.price, 0);
  const valid = cart.length > 0 && (mode === "paid" || customer.trim().length > 0);
  const receivedNum = Number(received) || 0;
  const change = receivedNum - total;

  return (
    <Sheet onClose={onClose} title={`Checkout (${cart.length} item${cart.length > 1 ? "s" : ""})`}>
      <div style={{ display: "flex", flexDirection: "column", gap: 10, marginBottom: 18 }}>
        {cart.map((c) => {
          const product = products.find((p) => p.id === c.productId);
          const stock = product ? Number(product.stock) : c.qty;
          const step = c.soldBy === "kg" ? 0.1 : 1;
          return (
            <div key={c.productId} style={{ background: CARD, border: `1px solid ${BORDER}`, borderRadius: 12, padding: "12px 14px" }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8 }}>
                <div style={{ fontSize: 15 }}>{c.name}</div>
                <button onClick={() => onRemove(c.productId)} style={{ background: "transparent", border: "none", color: MUTED, cursor: "pointer" }}>
                  <X size={16} />
                </button>
              </div>
              <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between" }}>
                <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                  <RoundBtn onClick={() => onUpdateQty(c.productId, Number((c.qty - step).toFixed(2)), stock)}>
                    <Minus size={14} />
                  </RoundBtn>
                  <span style={{ fontSize: 15, minWidth: 46, textAlign: "center" }}>{fmtQty(c.qty, c.soldBy)}</span>
                  <RoundBtn onClick={() => onUpdateQty(c.productId, Number((c.qty + step).toFixed(2)), stock)}>
                    <Plus size={14} />
                  </RoundBtn>
                </div>
                <div style={{ color: GOLD, fontSize: 15 }}>{peso(c.qty * c.price)}</div>
              </div>
            </div>
          );
        })}
      </div>

      <Field label="Payment">
        <div style={{ display: "flex", gap: 12 }}>
          {[
            { id: "paid", label: "Bayad na" },
            { id: "utang", label: "Utang" },
          ].map((opt) => {
            const active = mode === opt.id;
            return (
              <button key={opt.id} onClick={() => setMode(opt.id)} style={{ flex: 1, background: active ? GOLD_DIM : CARD, border: `1px solid ${active ? GOLD : BORDER}`, borderRadius: 10, padding: "14px", color: active ? GOLD : TEXT, fontFamily: SERIF, fontSize: 15, cursor: "pointer" }}>
                {opt.label}
              </button>
            );
          })}
        </div>
      </Field>

      {mode === "utang" && (
        <Field label="Customer name">
          <input style={inputStyle} placeholder="e.g., Aling Nena" value={customer} onChange={(e) => setCustomer(e.target.value)} />
        </Field>
      )}

      {mode === "paid" && (
        <Field label="Bayad ng customer (opsyonal)">
          <input
            style={inputStyle}
            type="number"
            inputMode="decimal"
            placeholder="0.00"
            value={received}
            onChange={(e) => setReceived(e.target.value)}
          />
          {received !== "" && (
            <div
              style={{
                marginTop: 10,
                display: "flex",
                justifyContent: "space-between",
                alignItems: "center",
                background: change >= 0 ? GOLD_DIM : DANGER_DIM,
                border: `1px solid ${change >= 0 ? GOLD : DANGER}`,
                borderRadius: 10,
                padding: "12px 14px",
              }}
            >
              <span style={{ fontSize: 14, color: change >= 0 ? GOLD : DANGER }}>{change >= 0 ? "Sukli (change)" : "Kulang (short)"}</span>
              <span style={{ fontSize: 18, color: change >= 0 ? GOLD : DANGER, fontWeight: 600 }}>{peso(Math.abs(change))}</span>
            </div>
          )}
        </Field>
      )}

      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "14px 0", borderTop: `1px solid ${BORDER}`, marginBottom: 18 }}>
        <span style={{ color: MUTED, fontSize: 15 }}>Total</span>
        <span style={{ color: GOLD, fontSize: 24 }}>{peso(total)}</span>
      </div>

      <button
        disabled={!valid}
        onClick={() => onConfirm({ customer: customer.trim(), isPaid: mode === "paid" })}
        style={{ width: "100%", background: valid ? GOLD : CARD2, color: valid ? "#141414" : MUTED, border: "none", borderRadius: 10, padding: "16px", fontSize: 16, fontFamily: SERIF, fontWeight: 600, cursor: valid ? "pointer" : "default" }}
      >
        Confirm sale
      </button>
    </Sheet>
  );
}

function RoundBtn({ onClick, children }) {
  return (
    <button onClick={onClick} style={{ width: 42, height: 42, borderRadius: "50%", background: CARD2, border: `1px solid ${BORDER}`, color: TEXT, display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer", flexShrink: 0 }}>
      {children}
    </button>
  );
}

// ---------- UTANG TAB ----------
function UtangTab({ sales, customers, expandedCustomer, setExpandedCustomer, applyPayment, onEditInfo }) {
  const [q, setQ] = useState("");
  const [filter, setFilter] = useState("unpaid");
  const [payFor, setPayFor] = useState(null);

  const list = useMemo(() => {
    const map = {};
    sales
      .filter((s) => s.customer)
      .forEach((s) => {
        if (!map[s.customer]) map[s.customer] = { name: s.customer, items: [], owed: 0, settled: 0 };
        map[s.customer].items.push(s);
        map[s.customer].owed += remainingOf(s);
        map[s.customer].settled += Number(s.paidAmount || 0);
      });
    Object.values(map).forEach((c) => {
      c.items.sort((a, b) => a.timestamp - b.timestamp);
      c.oldestDate = c.items[0]?.timestamp;
      c.info = customers[c.name] || {};
    });
    return Object.values(map).sort((a, b) => b.owed - a.owed || a.oldestDate - b.oldestDate);
  }, [sales, customers]);

  const filtered = list
    .filter((c) => c.name.toLowerCase().includes(q.toLowerCase()))
    .filter((c) => {
      if (filter === "unpaid") return c.owed > 0.001;
      if (filter === "paid") return c.owed <= 0.001 && c.settled > 0;
      return true;
    });

  const today = startOfDay(Date.now());

  return (
    <div>
      <div style={{ padding: "18px 20px 10px" }}>
        <div style={{ position: "relative", marginBottom: 14 }}>
          <Search size={16} color={MUTED} style={{ position: "absolute", left: 14, top: 15 }} />
          <input style={{ ...inputStyle, paddingLeft: 38 }} placeholder="Hanapin ang pangalan..." value={q} onChange={(e) => setQ(e.target.value)} />
        </div>
        <div style={{ display: "flex", gap: 10 }}>
          {[
            { id: "unpaid", label: "May utang" },
            { id: "paid", label: "Bayad na" },
            { id: "all", label: "Lahat" },
          ].map((opt) => {
            const active = filter === opt.id;
            return (
              <button key={opt.id} onClick={() => setFilter(opt.id)} style={{ background: active ? GOLD : CARD, color: active ? "#141414" : TEXT, border: `1px solid ${active ? GOLD : BORDER}`, borderRadius: 20, padding: "8px 16px", fontSize: 14, fontFamily: SERIF, cursor: "pointer" }}>
                {opt.label}
              </button>
            );
          })}
        </div>
      </div>

      {filtered.length === 0 ? (
        <EmptyState icon={Users} title={filter === "unpaid" ? "Walang utang" : "Walang makita"} subtitle={filter === "unpaid" ? "Wala pang hindi pa nababayaran." : "Try a different filter or search."} />
      ) : (
        <div style={{ padding: "6px 20px", display: "flex", flexDirection: "column", gap: 10 }}>
          {filtered.map((c) => {
            const expanded = expandedCustomer === c.name;
            const overLimit = c.info.limit && Number(c.info.limit) > 0 && c.owed > Number(c.info.limit);
            const dueTs = c.info.dueDate ? new Date(c.info.dueDate).getTime() : null;
            const overdue = dueTs && dueTs < today && c.owed > 0.001;

            return (
              <div key={c.name} style={{ background: CARD, border: `1px solid ${overLimit ? DANGER : BORDER}`, borderRadius: 12, overflow: "hidden" }}>
                <button
                  onClick={() => setExpandedCustomer(expanded ? null : c.name)}
                  style={{ width: "100%", textAlign: "left", background: "transparent", border: "none", padding: "14px 16px", display: "flex", justifyContent: "space-between", alignItems: "center", cursor: "pointer", color: TEXT, fontFamily: SERIF }}
                >
                  <div style={{ minWidth: 0 }}>
                    <div style={{ fontSize: 16 }}>{c.name}</div>
                    <div style={{ fontSize: 13, color: MUTED, marginTop: 4 }}>
                      Since {fmtDate(c.oldestDate)} &middot; {c.items.length} item{c.items.length > 1 ? "s" : ""}
                    </div>
                    {(overLimit || overdue) && (
                      <div style={{ display: "flex", gap: 6, marginTop: 8, flexWrap: "wrap" }}>
                        {overLimit && <span style={{ fontSize: 13, color: DANGER, border: `1px solid ${DANGER}`, borderRadius: 20, padding: "2px 8px" }}>lampas sa limit</span>}
                        {overdue && <span style={{ fontSize: 13, color: GOLD, border: `1px solid ${GOLD}`, borderRadius: 20, padding: "2px 8px" }}>lampas na sa due date</span>}
                      </div>
                    )}
                  </div>
                  <div style={{ display: "flex", alignItems: "center", gap: 8, flexShrink: 0, marginLeft: 8 }}>
                    <div style={{ color: c.owed > 0.001 ? DANGER : GOLD, fontSize: 17 }}>{c.owed > 0.001 ? peso(c.owed) : "Bayad na"}</div>
                    {expanded ? <ChevronDown size={16} color={MUTED} /> : <ChevronRight size={16} color={MUTED} />}
                  </div>
                </button>

                {expanded && (
                  <div style={{ borderTop: `1px solid ${BORDER}`, padding: "10px 16px 16px" }}>
                    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12 }}>
                      {c.info.phone ? <div style={{ fontSize: 13, color: MUTED }}>{c.info.phone}</div> : <div />}
                      <button
                        onClick={() => onEditInfo(c.name)}
                        style={{ display: "flex", alignItems: "center", gap: 6, background: "transparent", border: `1px solid ${BORDER}`, borderRadius: 8, padding: "6px 10px", color: MUTED, fontFamily: SERIF, fontSize: 13, cursor: "pointer" }}
                      >
                        <Pencil size={12} /> Edit info
                      </button>
                    </div>

                    {c.items
                      .slice()
                      .reverse()
                      .map((it) => {
                        const rem = remainingOf(it);
                        return (
                          <div key={it.id} style={{ padding: "10px 0", borderBottom: `1px solid ${BORDER}` }}>
                            <div style={{ display: "flex", justifyContent: "space-between", fontSize: 14 }}>
                              <span>
                                {it.name} &middot; {fmtQty(it.qty, it.soldBy)}
                              </span>
                              <span style={{ color: rem > 0.001 ? DANGER : GOLD }}>{peso(it.total)}</span>
                            </div>
                            <div style={{ fontSize: 13, color: MUTED, marginTop: 3 }}>Nag-utang: {fmtDate(it.timestamp)}</div>
                            {rem > 0.001 && Number(it.paidAmount || 0) > 0 && (
                              <div style={{ fontSize: 13, color: GOLD, marginTop: 2 }}>
                                Nabayaran na: {peso(it.paidAmount)} &middot; Natitira: {peso(rem)}
                              </div>
                            )}
                            {it.payments && it.payments.length > 0 && (
                              <div style={{ marginTop: 4 }}>
                                {it.payments.map((pay) => (
                                  <div key={pay.id} style={{ fontSize: 13, color: MUTED }}>
                                    Bayad {peso(pay.amount)} &middot; {fmtDate(pay.timestamp)}
                                  </div>
                                ))}
                              </div>
                            )}
                          </div>
                        );
                      })}

                    {c.owed > 0.001 && (
                      <div style={{ marginTop: 12 }}>
                        {payFor === c.name ? (
                          <PayForm max={c.owed} onCancel={() => setPayFor(null)} onSubmit={(amt) => { applyPayment(c.name, amt); setPayFor(null); }} />
                        ) : (
                          <div style={{ display: "flex", gap: 8 }}>
                            <button onClick={() => setPayFor(c.name)} style={{ flex: 1, background: CARD2, color: TEXT, border: `1px solid ${BORDER}`, borderRadius: 8, padding: "10px", fontFamily: SERIF, fontSize: 14, cursor: "pointer" }}>
                              Magbayad ng konti
                            </button>
                            <button
                              onClick={() => applyPayment(c.name, c.owed)}
                              style={{ flex: 1, background: GOLD, color: "#141414", border: "none", borderRadius: 8, padding: "10px", fontFamily: SERIF, fontSize: 14, fontWeight: 600, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", gap: 6 }}
                            >
                              <Check size={15} /> Bayad na lahat
                            </button>
                          </div>
                        )}
                      </div>
                    )}
                  </div>
                )}
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

function PayForm({ max, onCancel, onSubmit }) {
  const [amt, setAmt] = useState("");
  const num = Math.min(Number(amt) || 0, max);
  return (
    <div>
      <div style={{ display: "flex", gap: 8, marginBottom: 8 }}>
        <input style={{ ...inputStyle, flex: 1 }} type="number" inputMode="decimal" placeholder={`hanggang ${peso(max)}`} value={amt} onChange={(e) => setAmt(e.target.value)} autoFocus />
      </div>
      <div style={{ display: "flex", gap: 8 }}>
        <button onClick={onCancel} style={{ flex: 1, background: "transparent", color: MUTED, border: `1px solid ${BORDER}`, borderRadius: 8, padding: "10px", fontFamily: SERIF, fontSize: 14, cursor: "pointer" }}>
          Kanselahin
        </button>
        <button disabled={num <= 0} onClick={() => onSubmit(num)} style={{ flex: 1, background: num > 0 ? GOLD : CARD2, color: num > 0 ? "#141414" : MUTED, border: "none", borderRadius: 8, padding: "10px", fontFamily: SERIF, fontSize: 14, fontWeight: 600, cursor: num > 0 ? "pointer" : "default" }}>
          Bayad {num > 0 ? peso(num) : ""}
        </button>
      </div>
    </div>
  );
}

// ---------- CUSTOMER INFO SHEET ----------

      </Field>

        <input style={inputStyle} type="date" value={dueDate} onChange={(e) => setDueDate(e.target.value)} />
      </Field>
      <Field label="Utang limit, \u20B1 (optional)">
