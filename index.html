      </Field>
      <Field label="Note (optional)">
        <input style={inputStyle} placeholder="e.g., kapitbahay, tita ni Jun" value={note} onChange={(e) => setNote(e.target.value)} />
      </Field>
      <button
        onClick={() => onSave({ phone: phone.trim(), dueDate, note: note.trim(), limit: limit === "" ? null : Number(limit) })}
        style={{ width: "100%", background: GOLD, color: "#141414", border: "none", borderRadius: 10, padding: "16px", fontSize: 16, fontFamily: SERIF, fontWeight: 600, cursor: "pointer" }}
      >
        Save info
      </button>
    </Sheet>
  );
}

// ---------- REPORTS TAB ----------
function ReportsTab({ sales, totalStockPieces, totalStockKg, onUndoLast, onOpenClosing, onOpenCashDrawer }) {
  const [range, setRange] = useState("today");
  const [customStart, setCustomStart] = useState("");
  const [customEnd, setCustomEnd] = useState("");
  const [confirmUndo, setConfirmUndo] = useState(false);

  const scopedSales = sales.filter((s) => inRange(s.timestamp, range, customStart, customEnd));

  let revenue = 0;
  let profit = 0;
  sales.forEach((s) => {
    const rate = marginRateOf(s);
    (s.payments || []).forEach((p) => {
      if (inRange(p.timestamp, range, customStart, customEnd)) {
        revenue += p.amount;
        profit += p.amount * rate;
      }
    });
  });

  const productsSold = scopedSales.reduce((s, x) => s + Number(x.qty), 0);

  const bestSellers = useMemo(() => {
    const map = {};
    scopedSales.forEach((s) => {
      if (!map[s.productId]) map[s.productId] = { name: s.name, qty: 0, total: 0, soldBy: s.soldBy };
      map[s.productId].qty += Number(s.qty);
      map[s.productId].total += Number(s.total);
    });
    return Object.values(map)
      .sort((a, b) => b.qty - a.qty)
      .slice(0, 5);
  }, [scopedSales]);

  const lastSale = sales.length > 0 ? sales[sales.length - 1] : null;
  const lastBatch = lastSale ? (lastSale.batchId ? sales.filter((s) => s.batchId === lastSale.batchId) : [lastSale]) : [];
  const canUndo = lastBatch.length > 0 && lastBatch.every((s) => (s.customer ? (s.payments || []).length === 0 : true));

  return (
    <div style={{ padding: "18px 20px" }}>
      <div style={{ display: "flex", gap: 8, marginBottom: 14, overflowX: "auto", paddingBottom: 2 }}>
        {[
          { id: "today", label: "Today" },
          { id: "week", label: "This week" },
          { id: "month", label: "This month" },
          { id: "all", label: "All time" },
          { id: "custom", label: "Custom" },
        ].map((opt) => {
          const active = range === opt.id;
          return (
            <button key={opt.id} onClick={() => setRange(opt.id)} style={{ background: active ? GOLD : CARD, color: active ? "#141414" : TEXT, border: `1px solid ${active ? GOLD : BORDER}`, borderRadius: 20, padding: "8px 16px", fontSize: 13, fontFamily: SERIF, cursor: "pointer", whiteSpace: "nowrap", flexShrink: 0 }}>
              {opt.label}
            </button>
          );
        })}
      </div>

      {range === "custom" && (
        <div style={{ display: "flex", gap: 10, marginBottom: 16 }}>
          <input style={{ ...inputStyle, fontSize: 14 }} type="date" value={customStart} onChange={(e) => setCustomStart(e.target.value)} />
          <input style={{ ...inputStyle, fontSize: 14 }} type="date" value={customEnd} onChange={(e) => setCustomEnd(e.target.value)} />
        </div>
      )}

      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12, marginBottom: 12 }}>
        <StatCard label="Sales" value={scopedSales.length} />
        <StatCard label="Products sold" value={Number(productsSold.toFixed(2))} />
        <StatCard label="Revenue" value={peso(revenue)} gold />
        <StatCard label="Profit" value={peso(profit)} gold />
      </div>
      <div style={{ fontSize: 13, color: MUTED, marginBottom: 16, lineHeight: 1.5 }}>
        Revenue at Profit ay batay lamang sa aktwal na nabayaran &mdash; hindi kasama ang hindi pa nababayarang utang.
      </div>

      <button
        onClick={onOpenCashDrawer}
        style={{ width: "100%", display: "flex", alignItems: "center", justifyContent: "center", gap: 8, background: GOLD_DIM, border: `1px solid ${GOLD}`, borderRadius: 10, padding: "14px", color: GOLD, fontFamily: SERIF, fontSize: 15, fontWeight: 600, cursor: "pointer", marginBottom: 10 }}
      >
        <Wallet size={17} /> Cash drawer
      </button>

      <div style={{ display: "flex", gap: 10, marginBottom: 20 }}>
        <button onClick={onOpenClosing} style={{ flex: 1, display: "flex", alignItems: "center", justifyContent: "center", gap: 8, background: CARD, border: `1px solid ${BORDER}`, borderRadius: 10, padding: "12px", color: TEXT, fontFamily: SERIF, fontSize: 14, cursor: "pointer" }}>
          <ClipboardList size={16} /> Closing summary
        </button>
        {lastSale && (
          <button
            disabled={!canUndo}
            onClick={() => {
              if (!confirmUndo) {
                setConfirmUndo(true);
                return;
              }
              onUndoLast();
              setConfirmUndo(false);
            }}
            title={!canUndo ? "Hindi na ma-undo dahil may bayad na" : ""}
            style={{ flex: 1, display: "flex", alignItems: "center", justifyContent: "center", gap: 8, background: confirmUndo ? DANGER_DIM : CARD, border: `1px solid ${confirmUndo ? DANGER : BORDER}`, borderRadius: 10, padding: "12px", color: canUndo ? (confirmUndo ? DANGER : TEXT) : MUTED, fontFamily: SERIF, fontSize: 14, cursor: canUndo ? "pointer" : "default", opacity: canUndo ? 1 : 0.5 }}
          >
            <Undo2 size={16} /> {confirmUndo ? "Confirm undo" : lastBatch.length > 1 ? `Undo last checkout (${lastBatch.length})` : "Undo last sale"}
          </button>
        )}
      </div>

      {bestSellers.length > 0 && (
        <div style={{ marginBottom: 20 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 8, color: MUTED, fontSize: 15, marginBottom: 10 }}>
            <TrendingUp size={16} /> Best sellers
          </div>
          <div style={{ background: CARD, border: `1px solid ${BORDER}`, borderRadius: 12, padding: "6px 16px" }}>
            {bestSellers.map((b, i) => (
              <div key={b.name + i} style={{ display: "flex", justifyContent: "space-between", padding: "10px 0", borderBottom: i < bestSellers.length - 1 ? `1px solid ${BORDER}` : "none" }}>
                <span style={{ fontSize: 14 }}>
                  {i + 1}. {b.name}
                </span>
                <span style={{ fontSize: 14, color: MUTED }}>
                  {fmtQty(b.qty, b.soldBy)} &middot; {peso(b.total)}
                </span>
              </div>
            ))}
          </div>
        </div>
      )}

      <div style={{ background: CARD, border: `1px solid ${BORDER}`, borderRadius: 12, padding: "16px", marginBottom: 20 }}>
        <Row label="Stock \u2014 pieces" value={`${totalStockPieces} pc`} />
        <div style={{ height: 1, background: BORDER, margin: "10px 0" }} />
        <Row label="Stock \u2014 by weight" value={`${totalStockKg.toFixed(2)} kg`} />
      </div>

      <div style={{ fontSize: 15, color: MUTED, marginBottom: 10 }}>Sales</div>

      {scopedSales.length === 0 ? (
        <EmptyState icon={Receipt} title="No sales yet" subtitle="Completed sales will show up here." />
      ) : (
        <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
          {scopedSales
            .slice()
            .reverse()
            .map((s) => {
              const rem = remainingOf(s);
              return (
                <div key={s.id} style={{ background: CARD, border: `1px solid ${BORDER}`, borderRadius: 10, padding: "12px 14px", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                  <div style={{ minWidth: 0 }}>
                    <div style={{ fontSize: 15 }}>{s.name}</div>
                    <div style={{ fontSize: 13, color: MUTED, marginTop: 3 }}>
                      {fmtQty(s.qty, s.soldBy)} &middot; {range !== "today" ? `${fmtDateShort(s.timestamp)}, ` : ""}
                      {new Date(s.timestamp).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })}
                    </div>
                    {s.customer && <div style={{ fontSize: 13, color: MUTED, marginTop: 2 }}>{s.customer}</div>}
                  </div>
                  <div style={{ textAlign: "right" }}>
                    <div style={{ color: GOLD, fontSize: 15 }}>{peso(s.total)}</div>
                    {s.customer && <div style={{ fontSize: 13, color: rem > 0.001 ? DANGER : MUTED, marginTop: 2 }}>{rem > 0.001 ? `utang \u00b7 ${peso(rem)} natitira` : "bayad na"}</div>}
                  </div>
                </div>
              );
            })}
        </div>
      )}
    </div>
  );
}

function StatCard({ label, value, gold }) {
  return (
    <div style={{ background: CARD, border: `1px solid ${BORDER}`, borderRadius: 12, padding: "16px" }}>
      <div style={{ color: MUTED, fontSize: 14, marginBottom: 6 }}>{label}</div>
      <div style={{ color: gold ? GOLD : TEXT, fontSize: 24 }}>{value}</div>
    </div>
  );
}

function Row({ label, value }) {
  return (
    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
      <span style={{ color: MUTED, fontSize: 15 }}>{label}</span>
      <span style={{ fontSize: 17 }}>{value}</span>
    </div>
  );
}

// ---------- CLOSING SUMMARY ----------
function ClosingSummarySheet({ sales, products, onClose }) {
  const todaySales = sales.filter((s) => sameDay(s.timestamp));
  let revenue = 0;
  let profit = 0;
  let utangGiven = 0;
  let utangCollected = 0;
  sales.forEach((s) => {
    const rate = marginRateOf(s);
    (s.payments || []).forEach((p) => {
      if (sameDay(p.timestamp)) {
        revenue += p.amount;
        profit += p.amount * rate;
        if (s.customer) utangCollected += p.amount;
      }
    });
  });
  todaySales.forEach((s) => {
    if (s.customer) utangGiven += s.total;
  });

  const [copyLabel, setCopyLabel] = useState("Copy summary");
  const text = [
    `Counter \u2014 Closing Summary`,
    new Date().toLocaleDateString([], { weekday: "long", year: "numeric", month: "long", day: "numeric" }),
    ``,
    `Sales: ${todaySales.length}`,
    `Revenue collected: ${peso(revenue)}`,
    `Profit: ${peso(profit)}`,
    `New utang today: ${peso(utangGiven)}`,
    `Utang payments collected: ${peso(utangCollected)}`,
    ``,
    products.length > 0 ? `Low / out of stock:` : `Stock: all okay`,
    ...products.map((p) => `- ${p.name}: ${fmtQty(p.stock, p.soldBy)}${isOut(p) ? " (OUT)" : ""}`),
  ].join("\n");

  const copy = async () => {
    try {
      await navigator.clipboard.writeText(text);
      setCopyLabel("Copied!");
    } catch (e) {
      setCopyLabel("Couldn't copy");
    }
    setTimeout(() => setCopyLabel("Copy summary"), 2000);
  };

  return (
    <Sheet onClose={onClose} title="Closing summary">
      <div style={{ background: CARD, border: `1px solid ${BORDER}`, borderRadius: 12, padding: "16px", marginBottom: 16 }}>
        <Row label="Sales" value={todaySales.length} />
        <Divider />
        <Row label="Revenue collected" value={peso(revenue)} />
        <Divider />
        <Row label="Profit" value={peso(profit)} />
        <Divider />
        <Row label="New utang today" value={peso(utangGiven)} />
        <Divider />
        <Row label="Utang payments collected" value={peso(utangCollected)} />
      </div>

      {products.length > 0 && (
        <div style={{ marginBottom: 16 }}>
          <div style={{ color: MUTED, fontSize: 14, marginBottom: 8 }}>Low / out of stock</div>
          <div style={{ background: CARD, border: `1px solid ${BORDER}`, borderRadius: 12, padding: "4px 16px" }}>
            {products.map((p, i) => (
              <div key={p.id} style={{ display: "flex", justifyContent: "space-between", padding: "10px 0", borderBottom: i < products.length - 1 ? `1px solid ${BORDER}` : "none" }}>
                <span style={{ fontSize: 14 }}>{p.name}</span>
                <span style={{ fontSize: 14, color: isOut(p) ? DANGER : GOLD }}>{fmtQty(p.stock, p.soldBy)}</span>
              </div>
            ))}
          </div>
        </div>
      )}

      <button onClick={copy} style={{ width: "100%", background: GOLD, color: "#141414", border: "none", borderRadius: 10, padding: "16px", fontSize: 16, fontFamily: SERIF, fontWeight: 600, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", gap: 8 }}>
        <Copy size={16} /> {copyLabel}
      </button>
    </Sheet>
  );
}
function Divider() {
  return <div style={{ height: 1, background: BORDER, margin: "10px 0" }} />;
}

// ---------- CASH DRAWER ----------
function CashDrawerSheet({ sales, cashLogs, cashSessions, onClose, onSetOpening, onSetClosing, onAddLog, onRemoveLog }) {
  const session = cashSessions[todayKey()] || {};
  const [openingInput, setOpeningInput] = useState(session.opening ?? "");
  const [closingInput, setClosingInput] = useState(session.closing ?? "");
  const [showAddLog, setShowAddLog] = useState(false);

  const todayLogs = cashLogs.filter((l) => sameDay(l.timestamp));
  const totalOut = todayLogs.reduce((s, l) => s + l.amount, 0);

  let cashInToday = 0;
  sales.forEach((s) => {
    (s.payments || []).forEach((p) => {
      if (sameDay(p.timestamp)) cashInToday += p.amount;
    });
  });

  const hasOpening = session.opening !== undefined && session.opening !== null;
  const expected = (hasOpening ? session.opening : 0) + cashInToday - totalOut;
  const hasClosing = session.closing !== undefined && session.closing !== null;
  const diff = hasClosing ? session.closing - expected : null;

  return (
    <Sheet onClose={onClose} title="Cash drawer">
      <div style={{ color: MUTED, fontSize: 13, marginBottom: 18, lineHeight: 1.5 }}>
        Bilangin ang pera sa register sa umaga at sa gabi para malaman kung tumpak, may sobra, o may kulang.
      </div>

      <Field label="Panimulang pera ngayong umaga (opening)">
        <div style={{ display: "flex", gap: 8 }}>
          <input
            style={{ ...inputStyle, flex: 1 }}
            type="number"
            inputMode="decimal"
            placeholder="0.00"
            value={openingInput}
            onChange={(e) => setOpeningInput(e.target.value)}
          />
          <button
            disabled={openingInput === ""}
            onClick={() => onSetOpening(openingInput)}
            style={{ background: openingInput !== "" ? GOLD : CARD2, color: openingInput !== "" ? "#141414" : MUTED, border: "none", borderRadius: 10, padding: "0 18px", fontFamily: SERIF, fontSize: 14, fontWeight: 600, cursor: openingInput !== "" ? "pointer" : "default" }}
          >
            Save
          </button>
        </div>
        {hasOpening && <div style={{ fontSize: 13, color: GOLD, marginTop: 6 }}>Naka-save: {peso(session.opening)}</div>}
      </Field>

      <div style={{ marginBottom: 18 }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
          <div style={{ fontSize: 14, color: MUTED }}>Cash na kinuha ngayon</div>
          <button
            onClick={() => setShowAddLog(true)}
            style={{ display: "flex", alignItems: "center", gap: 4, background: CARD2, border: `1px solid ${BORDER}`, borderRadius: 8, padding: "6px 10px", color: TEXT, fontFamily: SERIF, fontSize: 13, cursor: "pointer" }}
          >
            <Plus size={13} /> Add
          </button>
        </div>

        {showAddLog && (
          <AddCashLogForm
            onCancel={() => setShowAddLog(false)}
            onSubmit={(amount, reason) => {
              onAddLog(amount, reason);
              setShowAddLog(false);
            }}
          />
        )}

        {todayLogs.length === 0 && !showAddLog ? (
          <div style={{ color: MUTED, fontSize: 13, textAlign: "center", padding: "16px 0" }}>Wala pang nakuhang cash ngayon.</div>
        ) : (
          <div style={{ display: "flex", flexDirection: "column", gap: 8, marginTop: showAddLog ? 10 : 0 }}>
            {todayLogs
              .slice()
              .reverse()
              .map((l) => (
                <div key={l.id} style={{ background: CARD, border: `1px solid ${BORDER}`, borderRadius: 10, padding: "10px 12px", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                  <div style={{ minWidth: 0 }}>
                    <div style={{ fontSize: 14 }}>{l.reason || "(walang detalye)"}</div>
                    <div style={{ fontSize: 13, color: MUTED, marginTop: 2 }}>{fmtDate(l.timestamp)}</div>
                  </div>
                  <div style={{ display: "flex", alignItems: "center", gap: 10, flexShrink: 0, marginLeft: 8 }}>
                    <span style={{ color: DANGER, fontSize: 14 }}>-{peso(l.amount)}</span>
                    <button onClick={() => onRemoveLog(l.id)} style={{ background: "transparent", border: "none", color: MUTED, cursor: "pointer" }}>
                      <Trash2 size={14} />
                    </button>
                  </div>
                </div>
              ))}
          </div>
        )}
        {todayLogs.length > 0 && (
          <div style={{ display: "flex", justifyContent: "space-between", marginTop: 10, fontSize: 13, color: MUTED }}>
            <span>Total na kinuha</span>
            <span style={{ color: DANGER }}>-{peso(totalOut)}</span>
          </div>
        )}
      </div>

      <div style={{ background: CARD, border: `1px solid ${BORDER}`, borderRadius: 12, padding: "16px", marginBottom: 18 }}>
        <Row label="Opening" value={peso(hasOpening ? session.opening : 0)} />
        <Divider />
        <Row label="+ Cash sales ngayon" value={peso(cashInToday)} />
        <Divider />
        <Row label="- Kinuhang cash" value={peso(totalOut)} />
        <Divider />
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
          <span style={{ fontSize: 15 }}>Dapat nasa register ngayon</span>
          <span style={{ fontSize: 19, color: GOLD }}>{peso(expected)}</span>
        </div>
      </div>

      <Field label="Binilang na cash ngayong gabi (closing)">
        <div style={{ display: "flex", gap: 8 }}>
          <input
            style={{ ...inputStyle, flex: 1 }}
            type="number"
            inputMode="decimal"
            placeholder="0.00"
            value={closingInput}
            onChange={(e) => setClosingInput(e.target.value)}
          />
          <button
            disabled={closingInput === ""}
            onClick={() => onSetClosing(closingInput)}
            style={{ background: closingInput !== "" ? GOLD : CARD2, color: closingInput !== "" ? "#141414" : MUTED, border: "none", borderRadius: 10, padding: "0 18px", fontFamily: SERIF, fontSize: 14, fontWeight: 600, cursor: closingInput !== "" ? "pointer" : "default" }}
          >
            Save
          </button>
        </div>
      </Field>

      {hasClosing && (
        <div
          style={{
            background: diff === 0 ? GOLD_DIM : diff > 0 ? GOLD_DIM : DANGER_DIM,
            border: `1px solid ${diff === 0 ? GOLD : diff > 0 ? GOLD : DANGER}`,
            borderRadius: 12,
            padding: "16px",
            textAlign: "center",
          }}
        >
          <div style={{ fontSize: 14, color: diff === 0 || diff > 0 ? GOLD : DANGER, marginBottom: 4 }}>
            {diff === 0 ? "Tumpak! \u2705" : diff > 0 ? "May sobra" : "May kulang"}
          </div>
          <div style={{ fontSize: 24, color: diff === 0 || diff > 0 ? GOLD : DANGER }}>{peso(Math.abs(diff))}</div>
        </div>
      )}
    </Sheet>
  );
}

function AddCashLogForm({ onCancel, onSubmit }) {
  const [amount, setAmount] = useState("");
  const [reason, setReason] = useState("");
  const valid = Number(amount) > 0;

  return (
    <div style={{ background: CARD, border: `1px solid ${BORDER}`, borderRadius: 10, padding: 12, marginBottom: 10 }}>
      <input
        style={{ ...inputStyle, marginBottom: 8 }}
        type="number"
        inputMode="decimal"
        placeholder="Halaga"
        value={amount}
        onChange={(e) => setAmount(e.target.value)}
        autoFocus
      />
      <input
        style={{ ...inputStyle, marginBottom: 10 }}
        placeholder="Para saan? (hal. pambili ng yelo)"
        value={reason}
        onChange={(e) => setReason(e.target.value)}
      />
      <div style={{ display: "flex", gap: 8 }}>
        <button onClick={onCancel} style={{ flex: 1, background: "transparent", color: MUTED, border: `1px solid ${BORDER}`, borderRadius: 8, padding: "10px", fontFamily: SERIF, fontSize: 14, cursor: "pointer" }}>
          Kanselahin
        </button>
        <button
          disabled={!valid}
          onClick={() => onSubmit(amount, reason)}
          style={{ flex: 1, background: valid ? GOLD : CARD2, color: valid ? "#141414" : MUTED, border: "none", borderRadius: 8, padding: "10px", fontFamily: SERIF, fontSize: 14, fontWeight: 600, cursor: valid ? "pointer" : "default" }}
        >
          Idagdag
        </button>
      </div>
    </div>
  );
}

// ---------- SETTINGS SHEET (export / import / security) ----------
function SettingsSheet({ products, sales, customers, settings, initialMode, onClose, onImport, onMarkBackedUp, onSetPin, onRemovePin }) {
  const [mode, setMode] = useState(initialMode || "export");
  const [copyLabel, setCopyLabel] = useState("Copy code");
  const [pasteText, setPasteText] = useState("");
  const [error, setError] = useState("");
  const [confirmOverwrite, setConfirmOverwrite] = useState(false);
  const textareaRef = useRef(null);

  const code = useMemo(() => JSON.stringify({ v: BACKUP_VERSION, exportedAt: Date.now(), products, sales, customers, settings: {} }), [products, sales, customers]);

  const copyCode = async () => {
    try {
      await navigator.clipboard.writeText(code);
      setCopyLabel("Copied!");
      onMarkBackedUp();
    } catch (e) {
      if (textareaRef.current) textareaRef.current.select();
      setCopyLabel("Select & copy");
    }
    setTimeout(() => setCopyLabel("Copy code"), 2000);
  };

  const tryImport = () => {
    setError("");
    let parsed;
    try {
      parsed = JSON.parse(pasteText.trim());
    } catch (e) {
      setError("That doesn't look like a valid backup code. Paste the exact code from the other phone.");
      return;
    }
    if (!parsed || (!Array.isArray(parsed.products) && !Array.isArray(parsed.sales))) {
      setError("That code isn't a Counter backup.");
      return;
    }
    if (!confirmOverwrite) {
      setConfirmOverwrite(true);
      return;
    }
    onImport(parsed);
    onClose();
  };

  return (
    <Sheet onClose={onClose} title="Settings">
      <div style={{ display: "flex", gap: 8, marginBottom: 20 }}>
        {[
          { id: "export", label: "Export" },
          { id: "import", label: "Import" },
          { id: "security", label: "Security" },
        ].map((opt) => {
          const active = mode === opt.id;
          return (
            <button
              key={opt.id}
              onClick={() => { setMode(opt.id); setError(""); setConfirmOverwrite(false); }}
              style={{ flex: 1, background: active ? GOLD_DIM : CARD, border: `1px solid ${active ? GOLD : BORDER}`, borderRadius: 10, padding: "10px 4px", color: active ? GOLD : TEXT, fontFamily: SERIF, fontSize: 13, cursor: "pointer" }}
            >
              {opt.label}
            </button>
          );
        })}
      </div>

      {mode === "export" && (
        <div>
          <div style={{ color: MUTED, fontSize: 14, marginBottom: 12, lineHeight: 1.5 }}>
            Copy this code and send it to the other phone. On that phone, open this same app, go to Settings &rarr; Import, and paste it in.
          </div>
          <textarea ref={textareaRef} readOnly value={code} onFocus={(e) => e.target.select()} style={{ ...inputStyle, height: 140, resize: "none", fontFamily: "monospace", fontSize: 13, marginBottom: 12 }} />
          <button onClick={copyCode} style={{ width: "100%", background: GOLD, color: "#141414", border: "none", borderRadius: 10, padding: "14px", fontSize: 15, fontFamily: SERIF, fontWeight: 600, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", gap: 8 }}>
            <Copy size={16} /> {copyLabel}
          </button>
          {settings.lastBackupAt && <div style={{ color: MUTED, fontSize: 13, marginTop: 10, textAlign: "center" }}>Last backup: {fmtDate(settings.lastBackupAt)}</div>}
        </div>
      )}

      {mode === "import" && (
        <div>
          <div style={{ color: MUTED, fontSize: 14, marginBottom: 12, lineHeight: 1.5 }}>
            Paste the code from the other phone below. This replaces every product and sale on this device with what's in the code.
          </div>
          <textarea
            value={pasteText}
            onChange={(e) => { setPasteText(e.target.value); setConfirmOverwrite(false); setError(""); }}
            placeholder="Paste the backup code here..."
            style={{ ...inputStyle, height: 140, resize: "none", fontFamily: "monospace", fontSize: 13, marginBottom: 12 }}
          />
          {error && (
            <div style={{ color: DANGER, fontSize: 13, marginBottom: 12, display: "flex", gap: 8, alignItems: "flex-start" }}>
              <AlertTriangle size={15} style={{ flexShrink: 0, marginTop: 2 }} /> {error}
            </div>
          )}
          {confirmOverwrite && !error && (
            <div style={{ color: GOLD, fontSize: 13, marginBottom: 12, display: "flex", gap: 8, alignItems: "flex-start" }}>
              <AlertTriangle size={15} style={{ flexShrink: 0, marginTop: 2 }} /> This will overwrite everything currently on this phone. Tap import again to confirm.
            </div>
          )}
          <button
            disabled={!pasteText.trim()}
            onClick={tryImport}
            style={{ width: "100%", background: pasteText.trim() ? GOLD : CARD2, color: pasteText.trim() ? "#141414" : MUTED, border: "none", borderRadius: 10, padding: "14px", fontSize: 15, fontFamily: SERIF, fontWeight: 600, cursor: pasteText.trim() ? "pointer" : "default", display: "flex", alignItems: "center", justifyContent: "center", gap: 8 }}
          >
            <ClipboardPaste size={16} /> {confirmOverwrite ? "Confirm import" : "Import"}
          </button>
        </div>
      )}

      {mode === "security" && <SecurityPanel settings={settings} onSetPin={onSetPin} onRemovePin={onRemovePin} />}
    </Sheet>
  );
}

function SecurityPanel({ settings, onSetPin, onRemovePin }) {
  const [editing, setEditing] = useState(!settings.pinEnabled);
  const [p1, setP1] = useState("");
  const [p2, setP2] = useState("");
  const [err, setErr] = useState("");
  const [confirmRemove, setConfirmRemove] = useState(false);

  const submit = () => {
    setErr("");
    if (!/^\d{4,6}$/.test(p1)) {
      setErr("Gumamit ng 4-6 digit na numero.");
      return;
    }
    if (p1 !== p2) {
      setErr("Hindi magkatugma ang PIN.");
      return;
    }
    onSetPin(p1);
    setEditing(false);
    setP1("");
    setP2("");
  };

  if (!editing) {
    return (
      <div>
        <div style={{ display: "flex", alignItems: "center", gap: 10, background: CARD, border: `1px solid ${BORDER}`, borderRadius: 12, padding: "14px 16px", marginBottom: 16 }}>
          <Lock size={18} color={GOLD} />
          <div style={{ flex: 1, fontSize: 14 }}>PIN lock is ON</div>
        </div>
        <button onClick={() => setEditing(true)} style={{ width: "100%", background: CARD2, color: TEXT, border: `1px solid ${BORDER}`, borderRadius: 10, padding: "14px", fontSize: 15, fontFamily: SERIF, cursor: "pointer", marginBottom: 10 }}>
          Baguhin ang PIN
        </button>
        <button
          onClick={() => {
            if (!confirmRemove) {
              setConfirmRemove(true);
              return;
            }
            onRemovePin();
            setConfirmRemove(false);
          }}
          style={{ width: "100%", background: confirmRemove ? DANGER_DIM : "transparent", color: DANGER, border: `1px solid ${DANGER}`, borderRadius: 10, padding: "14px", fontSize: 15, fontFamily: SERIF, cursor: "pointer" }}
        >
          {confirmRemove ? "Tap again to confirm" : "Alisin ang PIN lock"}
        </button>
      </div>
    );
  }

  return (
    <div>
      <div style={{ color: MUTED, fontSize: 14, marginBottom: 16, lineHeight: 1.5 }}>Set a 4-6 digit PIN so only your family can open the app.</div>
      <Field label="New PIN">
        <input style={inputStyle} type="password" inputMode="numeric" maxLength={6} value={p1} onChange={(e) => setP1(e.target.value.replace(/\D/g, ""))} />
      </Field>
      <Field label="Confirm PIN">
        <input style={inputStyle} type="password" inputMode="numeric" maxLength={6} value={p2} onChange={(e) => setP2(e.target.value.replace(/\D/g, ""))} />
      </Field>
      {err && <div style={{ color: DANGER, fontSize: 13, marginBottom: 12 }}>{err}</div>}
      <button onClick={submit} style={{ width: "100%", background: GOLD, color: "#141414", border: "none", borderRadius: 10, padding: "14px", fontSize: 15, fontFamily: SERIF, fontWeight: 600, cursor: "pointer" }}>
        Save PIN
      </button>
      {settings.pinEnabled && (
        <button onClick={() => setEditing(false)} style={{ width: "100%", background: "transparent", color: MUTED, border: "none", padding: "12px", fontSize: 14, fontFamily: SERIF, cursor: "pointer", marginTop: 6 }}>
          Cancel
        </button>
      )}
    </div>
  );
}

// ---------- generic bottom sheet ----------
function Sheet({ title, onClose, children }) {
  return (
    <div style={{ position: "absolute", inset: 0, background: "rgba(0,0,0,0.6)", display: "flex", alignItems: "flex-end", zIndex: 20 }} onClick={onClose}>
      <div onClick={(e) => e.stopPropagation()} style={{ width: "100%", maxHeight: "88%", overflowY: "auto", background: BG, borderTop: `1px solid ${BORDER}`, borderTopLeftRadius: 20, borderTopRightRadius: 20, padding: "20px 20px 28px" }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 20 }}>
          <div style={{ fontSize: 20 }}>{title}</div>
          <button onClick={onClose} style={{ background: "transparent", border: "none", color: MUTED, cursor: "pointer" }}>
            <X size={22} />
          </button>
        </div>
        {children}
      </div>
    </div>
  );
}


class ErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = { error: null }; }
  static getDerivedStateFromError(error) { return { error }; }
  render() {
    if (this.state.error) return (
      <div className="counter-app-mounted" style={{minHeight:"100vh",background:"#0a0a0a",color:"#f3f1ea",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:"24px",textAlign:"center",fontFamily:"Georgia,serif"}}>
        <div style={{fontSize:18,fontWeight:700,marginBottom:8}}>Something went wrong</div>
        <div style={{fontSize:13,color:"#8c8a84",marginBottom:16,maxWidth:320}}>The app hit an error. Reloading usually fixes it.</div>
        <div style={{fontSize:11,color:"#8c8a84",fontFamily:"monospace",maxWidth:320,wordBreak:"break-word",marginBottom:20,background:"#151515",padding:10,borderRadius:8}}>{String(this.state.error?.message || this.state.error)}</div>
        <button onClick={() => window.location.reload()} style={{background:"#E3A93C",color:"#141414",fontWeight:700,border:"none",borderRadius:10,padding:"10px 20px",fontSize:14}}>Reload</button>
      </div>
    );
    return this.props.children;
  }
}

window.addEventListener("error", (e) => console.error("Global error:", e.error || e.message));
window.addEventListener("unhandledrejection", (e) => console.error("Unhandled rejection:", e.reason));

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<ErrorBoundary><CounterApp /></ErrorBoundary>);

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./service-worker.js").catch((e) => console.warn("SW failed", e));
  });
}
</script>
</body>
</html>
